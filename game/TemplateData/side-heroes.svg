<svg xmlns="http://www.w3.org/2000/svg" width="120" height="360" viewBox="0 0 30 90">
  <!-- 左侧:勇者队伍竖列 (米色透明底, 棕色像素) -->
  <!-- 勇者 (剑+盾) -->
  <g fill="#6B4A2B">
    <rect x="13" y="6" width="4" height="4"/>
    <rect x="12" y="7" width="6" height="1"/>
    <rect x="13" y="8" width="4" height="1"/>
    <rect x="12" y="9" width="6" height="5"/>
    <rect x="11" y="10" width="1" height="3"/>
    <rect x="18" y="10" width="1" height="3"/>
    <rect x="13" y="14" width="1" height="2"/>
    <rect x="16" y="14" width="1" height="2"/>
  </g>
  <g fill="#8A6B4A">
    <rect x="20" y="2" width="1" height="6"/>
    <rect x="19" y="8" width="3" height="1"/>
  </g>
  <rect x="10" y="10" width="2" height="3" fill="#8A6B4A"/>

  <!-- 法师 (尖帽+法杖) -->
  <g fill="#7A5836">
    <rect x="13" y="26" width="1" height="1"/>
    <rect x="13" y="27" width="3" height="1"/>
    <rect x="13" y="28" width="3" height="4"/>
    <rect x="12" y="29" width="1" height="2"/>
    <rect x="16" y="29" width="1" height="2"/>
    <rect x="13" y="32" width="1" height="2"/>
    <rect x="15" y="32" width="1" height="2"/>
  </g>
  <g fill="#8A6B4A">
    <rect x="18" y="26" width="1" height="8"/>
    <rect x="17" y="25" width="3" height="1"/>
  </g>

  <!-- 战士 (壮+斧) -->
  <g fill="#5C4025">
    <rect x="13" y="46" width="4" height="4"/>
    <rect x="12" y="47" width="6" height="1"/>
    <rect x="12" y="49" width="6" height="5"/>
    <rect x="11" y="50" width="1" height="3"/>
    <rect x="18" y="50" width="1" height="3"/>
    <rect x="13" y="54" width="1" height="2"/>
    <rect x="16" y="54" width="1" height="2"/>
  </g>
  <g fill="#8A6B4A">
    <rect x="19" y="44" width="1" height="8"/>
    <rect x="20" y="44" width="2" height="1"/>
    <rect x="20" y="46" width="2" height="1"/>
  </g>

  <!-- 盗贼 (兜帽+匕首) -->
  <g fill="#8A6B4A">
    <rect x="13" y="66" width="4" height="3"/>
    <rect x="12" y="67" width="6" height="4"/>
    <rect x="11" y="68" width="1" height="2"/>
    <rect x="18" y="68" width="1" height="2"/>
    <rect x="13" y="71" width="1" height="2"/>
    <rect x="16" y="71" width="1" height="2"/>
  </g>
  <g fill="#6B4A2B">
    <rect x="19" y="70" width="1" height="3"/>
  </g>

  <!-- 地面点缀 -->
  <g fill="#8A6B4A" opacity="0.35">
    <rect x="6" y="84" width="18" height="1"/>
    <rect x="3" y="86" width="6" height="1"/>
    <rect x="21" y="86" width="6" height="1"/>
    <rect x="10" y="86" width="2" height="1"/>
  </g>
  <!-- 小草 -->
  <g fill="#8A6B4A" opacity="0.5">
    <rect x="4" y="82" width="1" height="2"/>
    <rect x="25" y="82" width="1" height="2"/>
  </g>
</svg>
