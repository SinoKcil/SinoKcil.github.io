    <rect x="20" y="67" width="1" height="8"/>
    <rect x="21" y="67" width="2" height="1"/>
    <rect x="22" y="68" width="1" height="2"/>
  </g>

  <!-- 地面点缀 (碎裂状) -->
  <g fill="#4A351F" opacity="0.35">
    <rect x="6" y="84" width="18" height="1"/>
    <rect x="4" y="86" width="5" height="1"/>
    <rect x="13" y="86" width="4" height="1"/>
    <rect x="22" y="86" width="4" height="1"/>
  </g>
  <!-- 尖刺 -->
  <g fill="#4A351F" opacity="0.5">
    <rect x="5" y="81" width="1" height="3"/>
    <rect x="25" y="82" width="1" height="2"/>
  </g>
