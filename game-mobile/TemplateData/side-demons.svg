<svg xmlns="http://www.w3.org/2000/svg" width="120" height="360" viewBox="0 0 30 90">
  <!-- 右侧:魔王军竖列 (米色透明底, 深棕像素) -->
  <!-- 魔王 (双角+披风+大剑) -->
  <g fill="#3B2A18">
    <rect x="12" y="2" width="1" height="4"/>
    <rect x="17" y="2" width="1" height="4"/>
    <rect x="10" y="10" width="10" height="7"/>
    <rect x="13" y="6" width="4" height="4"/>
    <rect x="12" y="10" width="6" height="5"/>
    <rect x="10" y="11" width="2" height="3"/>
    <rect x="18" y="11" width="2" height="3"/>
    <rect x="12" y="15" width="2" height="2"/>
    <rect x="16" y="15" width="2" height="2"/>
  </g>
  <rect x="14" y="7" width="1" height="1" fill="#E8DCC8"/>
  <rect x="16" y="7" width="1" height="1" fill="#E8DCC8"/>
  <g fill="#6B4A2B">
    <rect x="22" y="3" width="1" height="9"/>
    <rect x="21" y="11" width="3" height="1"/>
  </g>

  <!-- 天王一 (角+斧) -->
  <g fill="#4A351F">
    <rect x="12" y="26" width="1" height="2"/>
    <rect x="17" y="26" width="1" height="2"/>
    <rect x="13" y="28" width="4" height="3"/>
    <rect x="12" y="29" width="6" height="5"/>
    <rect x="11" y="30" width="1" height="3"/>
    <rect x="18" y="30" width="1" height="3"/>
    <rect x="13" y="34" width="1" height="2"/>
    <rect x="16" y="34" width="1" height="2"/>
  </g>
  <g fill="#3B2A18">
    <rect x="20" y="27" width="1" height="8"/>
    <rect x="21" y="27" width="2" height="1"/>
    <rect x="21" y="29" width="2" height="1"/>
  </g>

  <!-- 天王二 (角+矛) -->
  <g fill="#4A351F">
    <rect x="12" y="46" width="1" height="2"/>
    <rect x="17" y="46" width="1" height="2"/>
    <rect x="13" y="48" width="4" height="3"/>
    <rect x="12" y="49" width="6" height="5"/>
    <rect x="11" y="50" width="1" height="3"/>
    <rect x="18" y="50" width="1" height="3"/>
    <rect x="13" y="54" width="1" height="2"/>
    <rect x="16" y="54" width="1" height="2"/>
  </g>
  <g fill="#3B2A18">
    <rect x="20" y="44" width="1" height="10"/>
    <rect x="19" y="44" width="3" height="1"/>
  </g>

  <!-- 天王三 (角+镰) -->
  <g fill="#4A351F">
    <rect x="12" y="66" width="1" height="2"/>
    <rect x="17" y="66" width="1" height="2"/>
    <rect x="13" y="68" width="4" height="3"/>
    <rect x="12" y="69" width="6" height="5"/>
    <rect x="11" y="70" width="1" height="3"/>
    <rect x="18" y="70" width="1" height="3"/>
    <rect x="13" y="74" width="1" height="2"/>
    <rect x="16" y="74" width="1" height="2"/>
  </g>
