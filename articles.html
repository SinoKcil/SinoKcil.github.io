<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #8a8a8a;
    --line: #d9d9d9;
    --bg: #fafafa;
    --brown: #5C4025;
    --brown-soft: #8A6B4A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8e8e8;
      --ink-soft: #777;
      --line: #333;
      --bg: #111;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Songti SC", "SimSun", serif;

    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    width: min(900px, 92vw);

  h1 {
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: 0.1em;
  }
  .crumb {

    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .crumb a { color: inherit; text-decoration: none; }
  .crumb a:hover { color: var(--ink); }
  .article-list { margin-top: 3rem; display: flex; flex-direction: column; }
  .article-item {
    padding: 1.6rem 0.4rem;
    border-bottom: 1px solid var(--line);
  }
  .article-item a {
    text-decoration: none;
    color: inherit;
  }
  .article-item h2 {
    font-size: 1.15rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    line-height: 1.6;
    transition: color 0.25s;
  }
  .article-item a:hover h2 { color: var(--brown); }
  .article-meta {
    margin-top: 0.7rem;
    display: flex;
    gap: 1.4rem;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }
  .tags { display: flex; gap: 0.5rem; }
  .tag {
    color: var(--brown-soft);
    border: 1px solid var(--brown-soft);
    padding: 1px 8px;
    border-radius: 2px;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
  }
  .empty {
    margin-top: 3rem;
    color: var(--ink-soft);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
  }
  footer {
    padding: 1.6rem 8vw;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }
  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  footer a:hover { color: var(--ink); }
</style>
